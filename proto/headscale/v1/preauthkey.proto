syntax = "proto3";
package headscale.v1;

import "google/protobuf/timestamp.proto";
import "headscale/v1/user.proto";

option go_package = "github.com/juanfont/headscale/gen/go/v1";

message PreAuthKey {
  User user = 1;
  uint64 id = 2;
  string key = 3;
  bool reusable = 4;
  bool ephemeral = 5;
  bool used = 6;
  google.protobuf.Timestamp expiration = 7;
  google.protobuf.Timestamp created_at = 8;
  repeated string acl_tags = 9;
  // Fixed addresses the node registering with this key gets.
  string ipv4 = 10;
  string ipv6 = 11;
}

message CreatePreAuthKeyRequest {
  uint64 user = 1;
  bool reusable = 2;
  bool ephemeral = 3;
  google.protobuf.Timestamp expiration = 4;
  repeated string acl_tags = 5;
  // Fixed addresses for the node that registers with this key. Empty means
  // allocate as usual. Not allowed on reusable keys.
  string ipv4 = 6;
  string ipv6 = 7;
}

message CreatePreAuthKeyResponse {
  PreAuthKey pre_auth_key = 1;
}

message ExpirePreAuthKeyRequest {
  uint64 id = 1;
}

message ExpirePreAuthKeyResponse {}

message DeletePreAuthKeyRequest {
  uint64 id = 1;
}

message DeletePreAuthKeyResponse {}

message ListPreAuthKeysRequest {}

message ListPreAuthKeysResponse {
  repeated PreAuthKey pre_auth_keys = 1;
}
